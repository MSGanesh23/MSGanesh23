name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs automatically every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Runs whenever this file changes
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=msganesh23&background=0D1117&border=30363d&border_radius=16&ring=58a6ff&fire=58a6ff&currStreakNum=f0f6fc&sideNums=f0f6fc&currStreakLabel=8b949e&sideLabels=8b949e&dates=8b949e&stroke=30363d&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
